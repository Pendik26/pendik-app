<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f0d" />
    <meta
      name="description"
      content="Free flashcards, quizzes, timed block exams, ebooks and summaries for medical school. Works offline, with optional accounts that sync across devices."
    />
    <meta name="application-name" content="Medicine" />
    <meta name="apple-mobile-web-app-title" content="Medicine" />
    <!-- The SITE_URL placeholders below are filled in at build time (siteUrl() in vite.config.ts): link previews need absolute URLs. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medicine" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Medicine — Free Study Tool for Medical Students" />
    <meta
      property="og:description"
      content="Free flashcards, quizzes, timed block exams, ebooks and summaries for medical school. Works offline, with optional accounts that sync across devices."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Medicine: flashcards, quizzes, timed exams, ebooks and summaries. Works offline, with optional sync across devices."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Medicine — Free Study Tool for Medical Students" />
    <meta
      name="twitter:description"
      content="Free flashcards, quizzes, timed block exams, ebooks and summaries for medical school. Works offline, with optional accounts that sync across devices."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Medicine",
        "alternateName": "Medicine Study Tool",
        "url": "%SITE_URL%/",
        "description": "Free flashcards, quizzes, timed block exams, ebooks and summaries for medical school.",
        "inLanguage": "en"
      }
    </script>
    <meta
      name="twitter:image:alt"
      content="Medicine: flashcards, quizzes, timed exams, ebooks and summaries. Works offline, with optional sync across devices."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <noscript>
      <style>
        /* Without JavaScript nothing would ever hide the splash; show the page's text instead. */
        #app-splash {
          display: none !important;
        }
      </style>
    </noscript>
    <title>Medicine — Free Study Tool for Medical Students</title>
    <style>
      /* Critical, inlined so the splash paints before any bundled CSS/JS loads. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background-color: #0a0f0d;
        background-image:
          radial-gradient(ellipse 900px 520px at 12% -8%, rgb(45 212 167 / 0.14), transparent 60%),
          linear-gradient(rgb(45 212 167 / 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgb(45 212 167 / 0.07) 1px, transparent 1px);
        background-size: auto, 32px 32px, 32px 32px;
        color: #eef4f1;
        font-family: "Archivo", -apple-system, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      @media (prefers-color-scheme: light) {
        #app-splash {
          background-color: #f5f2e8;
          background-image:
            radial-gradient(ellipse 900px 520px at 12% -8%, rgb(15 143 112 / 0.1), transparent 60%),
            linear-gradient(rgb(15 143 112 / 0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgb(15 143 112 / 0.08) 1px, transparent 1px);
          color: #16211b;
        }
      }
      #app-splash.app-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash svg {
        color: #2dd4a7;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: app-splash-draw 1.1s ease-out 0.1s forwards;
      }
      @media (prefers-color-scheme: light) {
        #app-splash svg {
          color: #0f8f70;
        }
      }
      #app-splash .app-splash-word {
        font-family: "Fraunces", "Iowan Old Style", "Palatino Linotype", serif;
        font-weight: 600;
        font-size: 1.3rem;
        letter-spacing: -0.01em;
        opacity: 0;
        animation: app-splash-fade 0.5s ease 0.5s forwards;
      }
      #app-splash .app-splash-kicker {
        font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #2dd4a7;
        opacity: 0;
        animation: app-splash-fade 0.5s ease 0.65s forwards;
      }
      @media (prefers-color-scheme: light) {
        #app-splash .app-splash-kicker {
          color: #0f8f70;
        }
      }
      @keyframes app-splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes app-splash-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        #app-splash svg,
        #app-splash .app-splash-word,
        #app-splash .app-splash-kicker {
          animation: none !important;
          transition: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="presentation" aria-hidden="true">
      <svg viewBox="0 0 96 24" width="120" height="30" aria-hidden="true">
        <path
          d="M0 12h16l6-9 8 18 6-13 4 4h16l6-9 8 18 6-9h20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="app-splash-word">Medicine</span>
      <span class="app-splash-kicker">Booting the monitor…</span>
    </div>
    <noscript>
      <main style="max-width: 640px; margin: 3rem auto; padding: 0 1.25rem; font-family: sans-serif; line-height: 1.6">
        <h1>Medicine: study tool</h1>
        <p>
          A free study app for medical students: spaced-repetition flashcards, quizzes, timed block
          exams, ebooks, summaries and lecture slides, organised by study block. It works offline
          as a guest, with optional accounts that sync progress across devices.
        </p>
        <p>Medicine needs JavaScript. Please enable it to use the app.</p>
        <p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var start = Date.now();
        var MIN_MS = 550;
        function hide() {
          var el = document.getElementById("app-splash");
          if (!el) return;
          var wait = Math.max(0, MIN_MS - (Date.now() - start));
          setTimeout(function () {
            el.classList.add("app-splash-hide");
            setTimeout(function () {
              el.remove();
            }, 420);
          }, wait);
        }
        if (document.readyState === "complete") hide();
        else window.addEventListener("load", hide);
      })();
    </script>
  </body>
</html>
