<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Na+/K+ pump: each cycle moves 3 sodium ions out of the cell and 2 potassium ions into the cell"><text x="160" y="18" fill="var(--text-muted)" font-size="12" text-anchor="middle">Extracellular</text><rect x="20" y="90" width="280" height="14" rx="7" fill="var(--accent-soft)" stroke="var(--border)" stroke-width="1"/><rect x="20" y="126" width="280" height="14" rx="7" fill="var(--accent-soft)" stroke="var(--border)" stroke-width="1"/><rect x="125" y="75" width="45" height="80" rx="16" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="147" y="119" fill="var(--accent-ink)" font-size="10" text-anchor="middle" font-weight="700">pump</text><text x="160" y="207" fill="var(--text-muted)" font-size="12" text-anchor="middle">Cytoplasm</text><circle cx="90" cy="45" r="11" fill="var(--text)"/><text x="90" y="49" fill="var(--bg)" font-size="9" text-anchor="middle" font-weight="700">Na+</text><circle cx="147" cy="35" r="11" fill="var(--text)"/><text x="147" y="39" fill="var(--bg)" font-size="9" text-anchor="middle" font-weight="700">Na+</text><circle cx="205" cy="45" r="11" fill="var(--text)"/><text x="205" y="49" fill="var(--bg)" font-size="9" text-anchor="middle" font-weight="700">Na+</text><line x1="147" y1="75" x2="147" y2="58" stroke="var(--text)" stroke-width="2"/><circle cx="115" cy="185" r="11" fill="var(--accent-2)"/><text x="115" y="189" fill="var(--bg)" font-size="9" text-anchor="middle" font-weight="700">K+</text><circle cx="180" cy="185" r="11" fill="var(--accent-2)"/><text x="180" y="189" fill="var(--bg)" font-size="9" text-anchor="middle" font-weight="700">K+</text><line x1="147" y1="155" x2="147" y2="172" stroke="var(--accent-2)" stroke-width="2"/></svg>
