<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Tight junction sealing the apical membranes of two adjacent epithelial cells, blocking the paracellular space"><rect x="20" y="20" width="130" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/><rect x="170" y="20" width="130" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/><rect x="148" y="20" width="24" height="30" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="160" y="12" fill="var(--text-muted)" font-size="11" text-anchor="middle">Apical (lumen side)</text><line x1="160" y1="55" x2="160" y2="160" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="3 5"/><text x="160" y="172" fill="var(--text-muted)" font-size="11" text-anchor="middle">Lateral intercellular space</text><text x="80" y="95" fill="var(--text-muted)" font-size="12" text-anchor="middle">Cell A</text><text x="235" y="95" fill="var(--text-muted)" font-size="12" text-anchor="middle">Cell B</text><text x="160" y="38" fill="var(--accent-ink)" font-size="9" text-anchor="middle" font-weight="700">seal</text></svg>
