# Runs the SQL tests and the schema check (npm run db:test) on a plain Postgres when the database
# or the content it catalogs changes.
name: Database

on:
  pull_request:
    paths: ["database/**", "content/**", "scripts/content-catalog.mjs", ".github/workflows/database.yml"]
  push:
    branches: [main, major]
    paths: ["database/**", "content/**", "scripts/content-catalog.mjs", ".github/workflows/database.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Postgres client
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
      - run: bash database/tests/run.sh
      - run: bash database/tests/schema-check.sh
