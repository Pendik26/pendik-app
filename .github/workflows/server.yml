# Runs the server's tests against a real MongoDB, and checks that the study catalog
# (server/catalog.generated.ts) is in step with content/.
name: Server

on:
  pull_request:
    paths: ["server/**", "api/**", "content/**", "scripts/content-catalog.mjs", "package.json", ".github/workflows/server.yml"]
  push:
    branches: [main, major]
    paths: ["server/**", "api/**", "content/**", "scripts/content-catalog.mjs", "package.json", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npx tsc -p tsconfig.api.json
      - run: npx vitest run server
