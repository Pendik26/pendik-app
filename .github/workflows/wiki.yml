# Publishes docs/ and the student help (content/help/) to the GitHub wiki on every push that
# changes them. The wiki is a generated copy: edit the files in the repo.
name: Wiki

on:
  push:
    branches: [major]
    paths:
      - "docs/**"
      - "content/help/**"
      - "scripts/wiki.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the wiki pages
        run: node scripts/wiki.mjs wiki-out

      - name: Push them to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub creates the wiki's git repository only once its first page exists.
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki has no pages yet. Open https://github.com/${GITHUB_REPOSITORY}/wiki, save any first page, then re-run this workflow."
            exit 1
          fi
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r wiki-out/. wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync from ${GITHUB_SHA::7}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push
